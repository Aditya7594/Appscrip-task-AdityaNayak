<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Our Products | Appscrip PLP</title>
    <meta
      name="description"
      content="Explore our curated collection of apparel, accessories, and electronics with customizable filters and sorting."
    >
    <!-- Google Fonts for Static Version -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Inter:wght@800&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <!-- top strip + main header -->
    </header>

    <main id="main">
      <section class="hero">
        <!-- single h1 + paragraph -->
        <h1 class="visually-hidden">Discover Our Products</h1>
      </section>

      <div class="plp">
        <div class="toolbar">
          <!-- toolbar -->
        </div>

        <aside class="filters" aria-labelledby="filters-heading">
          <h2 id="filters-heading" class="visually-hidden">Filters</h2>
          <!-- filter sidebar -->
        </aside>

        <section class="results" aria-labelledby="products-heading">
          <h2 id="products-heading" class="visually-hidden">Products</h2>
          <ul class="product-grid">
            <!-- product grid items -->
          </ul>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <!-- site footer -->
    </footer>
  </body>
</html>
